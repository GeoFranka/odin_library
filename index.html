<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>My Library</title>
</head>
<body>
    
    <div class="flex" id="head">
        <h1>My Library</h1>
        <button type="button" id="addBtn">Add a new book</button>
    </div>
    <dialog closedby="any" id="addDialog">
        <h3>Add your book details here:</h3>
        <form action="" id="addForm">
            <p class="form-row"><label for="formAuthor">Author:</label><input type="text" name="author" id="formAuthor" required></p>
            <p class="form-row"><label for="formTitle">Title:</label><input type="text" name="title" id="formTitle" required></p>
            <p class="form-row"><label for="formPages">Pages:</label><input type="number" name="pages" id="formPages"></p>
            <label for="formRead"><input type="checkbox" name="read" id="formRead"> Have you read it yet?</label>
        </form>
        <button type="submit" form="addForm" id="saveBtn">Save to library</button>
    </dialog>
    <div id="lib"></div>

</body>
</html>
