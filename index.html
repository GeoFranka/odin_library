<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>My Library</title>
</head>
<body>
    
    <div class="flex" id="head">
        <h1>My Library</h1>
        <div class="flex" id="info">
            <p><img src="icons/bookshelf.svg" alt="" class="icon"><span id="number"></span></p>
            <p><img src="icons/note-multiple-outline.svg" alt="" class="icon"><span id="pages"></span></p>
             <p><img src="icons/book-open-blank-variant-outline.svg" alt="" class="icon"><span id="read"></span></p>
        </div>
        <button type="button" id="addBtn" class="btn">Add a new book</button>
    </div>
    <dialog closedby="any" id="addDialog">
        <h3 class="add">Add your book details:</h3>
        <h3 class="change">Change your book details:</h3>
        <form action="" id="addForm">
            <input type="hidden" name="id" id="formId">
            <p class="form-row">
                <label for="formAuthor">Author:</label>
                <input type="text" name="author" id="formAuthor" required>
                <span class="error"></span>
            </p>
            <p class="form-row">
                <label for="formTitle">Title:</label>
                <input type="text" name="title" id="formTitle" required>
                <span class="error"></span>
            </p>
            <p class="form-row"><label for="formPages">Pages:</label><input type="number" name="pages" id="formPages"></p>
            <label for="formRead"><input type="checkbox" name="read" id="formRead" value="read"> Have you read it?</label>
        </form>
        <button type="submit" form="addForm" id="saveBtn" class="btn">Save to library</button>
    </dialog>
    <div id="lib"></div>

</body>
</html>
